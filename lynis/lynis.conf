# Lynis Security Profile
# Copy to /etc/lynis/custom.prf or reference with: lynis audit profile=custom.prf

# --- General settings ---
profile-name = "Arch Security Baseline"
profile-version = "1.0"

# --- Skip tests you don't need ---
skip-test = "ssh-256.1"        # Skip outdated cipher tests
skip-test = "ssh-256.2"        # Skip MAC tests (covered by sshd_config)
skip-test = "kernel-2200"      # Skip GRUB tests (systemd-boot user)
skip-test = "grub-300*"        # Skip all GRUB tests
skip-test = "avahi*"           # Skip if you don't use Avahi
skip-test = "cups*"            # Skip if you don't print
skip-test = "nfs*"             # Skip if you don't use NFS
skip-test = "smb*"             # Skip if you don't use Samba
skip-test = "docker-*"         # Skip if you don't use Docker
skip-test = "kubernetes-*"     # Skip if you don't use k8s

# --- Enable specific tests ---
enable-test = "ssh-230*"       # SSH hardening
enable-test = "kernel-210*"    # Kernel hardening
enable-test = "network-400*"   # Network hardening
enable-test = "auditd-*"       # Auditd checks
enable-test = "firewall-*"     # Firewall checks
enable-test = "sysctl-*"       # Sysctl checks

# --- Report settings ---
report-quality = HIGH
report-email = ""              # Set if you want email reports
report-html = yes
