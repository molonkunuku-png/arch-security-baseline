# Kernel Hardening
# Copy to /etc/sysctl.d/99-hardening.conf
# Apply with: sudo sysctl --system

# --- Network ---
# Disable IP forwarding (disable if you need routing/VPN)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# Reverse path filtering (anti-spoof)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Log martians
net.ipv4.conf.all.log_martians = 1

# Disable IPv6 if not used (comment out if you use IPv6)
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1

# --- TCP hardening ---
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_sack = 0
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 0
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5

# --- Memory protection ---
# Restrict access to dmesg
kernel.dmesg_restrict = 1

# Restrict kptr (hide kernel pointers)
kernel.kptr_restrict = 2

# Disable ftrace for non-root (if supported)
kernel.ftrace_enabled = 0

# Yama LSM (restrict ptrace)
kernel.yama.ptrace_scope = 2

# Randomize memory layout
kernel.randomize_va_space = 2

# Disable exec-shield (use modern PaX alternatives if needed)
# kernel.exec-shield = 1

# --- Filesystem ---
# Restrict core dumps
fs.suid_dumpable = 0

# Restrict ptrace scope already set above
